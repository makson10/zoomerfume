# Loads the knowledge base into Qdrant and kb_records. Until the migrate Job has
# created the tables it fails and the Job retries it. Unchanged records are
# skipped, so a re-run embeds nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
spec:
  backoffLimit: 10
  # A finished Job deletes itself after an hour, so the next apply runs it again.
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: zoomerfume
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.kb.ingest"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
