# The whole stack for a local kind cluster: kubectl apply -k k8s/
# docs/k8s.md explains each piece and how it maps to docker-compose.yml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Every object goes into this namespace, so nothing lands in `default`.
namespace: zoomerfume

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres/pvc.yaml
  - postgres/deployment.yaml
  - postgres/service.yaml
  - qdrant/pvc.yaml
  - qdrant/deployment.yaml
  - qdrant/service.yaml
  - jobs/migrate.yaml
  - jobs/ingest.yaml
  - api/deployment.yaml
  - api/service.yaml

# The Secret is built from the git-ignored secrets.env (see secrets.env.example),
# so no password is committed.
secretGenerator:
  - name: app-secrets
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

# The app image for the api Deployment and both Jobs. scripts/kind-up.sh builds
# and loads this tag.
images:
  - name: zoomerfume
    newTag: 1.1.0
