# The note dictionary for the similar perfume search (app.kb.scent).
#
# accords: the scent families a product's accord vector is made of, one coordinate each.
#   Changing this list changes the vector size, so the products collection has to be deleted
#   before the next ingest.
# notes: every note the product cards use, under one canonical name. "aliases" are the other
#   spellings brands use for the same note. "accords" says how strongly the note brings in
#   each accord, from 0 to 1.

accords:
  - citrus
  - fruity
  - green
  - aromatic
  - fresh
  - aquatic
  - mineral
  - floral
  - white_floral
  - powdery
  - sweet
  - gourmand
  - vanilla
  - amber
  - warm_spicy
  - fresh_spicy
  - woody
  - smoky
  - leather
  - musky
  - earthy
  - balsamic
  - tobacco
  - boozy
  - mossy
  - creamy

notes:
  # Citrus
  bergamot:
    aliases: [calabrian bergamot]
    accords: {citrus: 1.0, fresh: 0.5}
  citrus:
    aliases: [citrus notes]
    accords: {citrus: 1.0, fresh: 0.5}
  grapefruit:
    accords: {citrus: 1.0, fresh: 0.4}
  lemon:
    aliases: [italian lemon, sicilian lemon, primofiore lemon]
    accords: {citrus: 1.0, fresh: 0.5}
  mandarin:
    aliases: [blood mandarin, green mandarin, tangerine]
    accords: {citrus: 1.0, fruity: 0.3, sweet: 0.2}
  orange:
    accords: {citrus: 1.0, fruity: 0.3}

  # Fruits
  apple:
    aliases: [green apple]
    accords: {fruity: 1.0, fresh: 0.4, green: 0.2}
  blackcurrant:
    aliases: [blackcurrant leaf]
    accords: {fruity: 0.9, green: 0.4}
  cherry:
    aliases: [black cherry accord, griotte syrup]
    accords: {fruity: 1.0, sweet: 0.6}
  dates:
    accords: {sweet: 0.8, fruity: 0.6, gourmand: 0.5}
  fruits:
    aliases: [fruit accord, tropical fruits]
    accords: {fruity: 1.0, sweet: 0.4}
  lychee:
    accords: {fruity: 1.0, floral: 0.3, sweet: 0.3}
  pear:
    accords: {fruity: 1.0, sweet: 0.3, fresh: 0.2}
  pineapple:
    accords: {fruity: 1.0, sweet: 0.4}
  raspberry:
    accords: {fruity: 1.0, sweet: 0.5}
  rhubarb:
    accords: {fruity: 0.6, green: 0.6, fresh: 0.3}
  wild berries:
    accords: {fruity: 1.0, sweet: 0.4}

  # Green and aromatic
  galbanum:
    accords: {green: 1.0, fresh: 0.3}
  geranium:
    accords: {floral: 0.6, aromatic: 0.5, green: 0.3}
  juniper:
    aliases: [juniper berries]
    accords: {aromatic: 0.7, fresh: 0.6, green: 0.3, woody: 0.2}
  lavender:
    aliases: [french lavender, lavender blossom, lavandin]
    accords: {aromatic: 1.0, floral: 0.3, fresh: 0.3}
  licorice:
