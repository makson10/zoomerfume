  mint:
    aliases: [mint leaves]
    accords: {fresh: 1.0, aromatic: 0.5, green: 0.3}
  pine:
    aliases: [pine needle]
    accords: {green: 0.7, fresh: 0.6, woody: 0.4, balsamic: 0.2}
  sage:
    aliases: [clary sage]
    accords: {aromatic: 1.0, green: 0.4, earthy: 0.2}
  star anise:
    accords: {warm_spicy: 0.7, aromatic: 0.5, sweet: 0.3}
  tea:
    aliases: [jasmine tea accord]
    accords: {green: 0.6, fresh: 0.4, aromatic: 0.3}

  # Spices
  cardamom:
    accords: {fresh_spicy: 0.8, aromatic: 0.5, warm_spicy: 0.3}
  cinnamon:
