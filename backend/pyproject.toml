[project]
name = "zoomerfume-backend"
version = "0.1.0"
description = "Zoomerfume shop assistant: FastAPI backend with an OpenAI Agents SDK chat agent"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "openai>=3.20.0",
    "openai-agents>=0.22.3",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]  # LLM prompt strings are intentionally long

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
